<app-header></app-header>

<div class="item-list">
  <div class="item-list__search-bar">
    <input class="item-list__input" type="text" placeholder="SEARCH" [ngModel]="search()"
      (ngModelChange)="search.set($event)" />
  </div>
  <div class="item-list__products">

    @if (filteredItems().length === 0 && search().trim().length > 0) {
      <span>No results</span>
    } @else {
      @for(item of filteredItems(); track item.id){
        <div id="item-card-{{item.id}}" class="item-card" [routerLink]="['/detail', item.id]">
          <img ngSrc="{{item.imgUrl}}" width="600" height="600" alt="item.name" class="item-card__image"/>
        </div>
      }
    }
  </div>
</div>
