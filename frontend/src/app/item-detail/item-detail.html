<app-header></app-header>
@if(item()){
<div class="item-detail">
    <div class="item-detail__image">
        <img ngSrc="{{item()?.imgUrl ?? ''}}" [alt]="item()?.brand" width="350">
    </div>
    <div class="item-content">
        <div class="item-content__description">
            <h3>DESCRIPTION</h3>
            <h2 class="item-card__brand">{{ item()?.brand }}</h2>
            <h3 class="item-card__model">{{ item()?.model }}</h3>
            <p class="item-card__price">Price: {{ item()?.price | currency }}</p>
        </div>
        <div class="item-content__actions">
            <h3>ACTIONS</h3>
        </div>
    </div>
</div>
}
